<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seguir ruta - Camina y Descubre</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #2d4a35; }

        #mapa-seguir {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
        }

        #panel {
            position: fixed;
            top: 1rem; left: 50%;
            transform: translateX(-50%);
            background: rgba(45, 74, 53, 0.9);
            color: #f5ead8;
            font-family: 'CanvaSans', sans-serif;
            border-radius: 16px;
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 2rem;
            align-items: center;
            z-index: 1000;
        }

        .panel-dato { display: flex; flex-direction: column; align-items: center; }
        .panel-valor { font-family: 'Lovelo', sans-serif; font-size: 1.4rem; }
        .panel-label { font-size: 0.6rem; opacity: 0.8; letter-spacing: 0.1rem; }

        #botones {
            position: fixed;
            bottom: 2rem; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 1000;
        }

        #botones button {
            font-family: 'CanvaSans', sans-serif;
            font-size: 0.9rem;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #btn-pausar { background: #f5ead8; color: #2d4a35; }
        #btn-parar { background: #7a1a1a; color: #f5ead8; }

        .leaflet-overlay-pane path {
            display: block !important;
            stroke: #fce8c6 !important;
            fill: none !important;
        }
    </style>
</head>
<body>

    <div id="mapa-seguir"></div>

    <!-- Modal permiso brújula (solo iOS) -->
    <div id="modal-brujula" style="
        display: none;
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 2000;
        align-items: center; justify-content: center;
    ">
        <div style="
            background: #f5ead8;
            border-radius: 20px;
            padding: 2rem;
            max-width: 300px;
            margin: 1rem;
            text-align: center;
            font-family: 'CanvaSans', sans-serif;
            color: #2d4a35;
        ">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🧭</div>
            <h3 style="margin: 0 0 0.8rem; font-family: 'Lovelo', sans-serif;">Activar brújula</h3>
            <p style="margin: 0 0 1.5rem; font-size: 0.9rem; line-height: 1.5;">
                Para mostrar hacia dónde estás mirando en el mapa, la app necesita acceder al giroscopio de tu móvil.<br><br>
                <strong>No se comparte ningún dato.</strong> Solo se usa para orientar la flecha en pantalla.
            </p>
            <button onclick="pedirPermisoBrujula()" style="
                background: #2d4a35; color: #f5ead8;
                border: none; border-radius: 20px;
                padding: 0.8rem 2rem;
                font-size: 1rem; font-family: 'CanvaSans', sans-serif;
                cursor: pointer; width: 100%; margin-bottom: 0.5rem;
            ">✅ Activar brújula</button>
            <button onclick="document.getElementById('modal-brujula').style.display='none'" style="
                background: transparent; color: #2d4a35;
                border: none; font-size: 0.85rem;
                cursor: pointer; padding: 0.5rem;
                font-family: 'CanvaSans', sans-serif;
            ">Ahora no</button>
        </div>
    </div>

    <div id="panel">
        <div class="panel-dato">
            <span class="panel-valor" id="tiempo">00:00</span>
            <span class="panel-label">Tiempo</span>
        </div>
        <div class="panel-dato">
            <span class="panel-valor" id="distancia">0.00</span>
            <span class="panel-label">km recorridos</span>
        </div>
        <div class="panel-dato">
            <span class="panel-valor" id="velocidad">0.0</span>
            <span class="panel-label">km/h</span>
        </div>
    </div>

    <div id="botones">
        <button id="btn-pausar" onclick="pausar()">⏸ Pausar</button>
        <button id="btn-parar" onclick="parar()">⏹ Terminar</button>
    </div>

    <script src="js/seguir.js"></script>
</body>
</html>
